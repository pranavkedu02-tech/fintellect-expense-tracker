{% if expenses %}
    <table class="expense-table">
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        {% for expense in expenses %}
        <tr>
            <td>{{ expense.title }}</td>
            <td>₹{{ expense.amount }}</td>
            <td><span class="badge">{{ expense.category }}</span></td>
            <td>{{ expense.date }}</td>
            <td>
                <a href="{% url 'edit_expense' expense.id %}">Edit</a> |
                <a href="{% url 'delete_expense' expense.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% else %}
    <div class="empty-state">
        <p>No expenses yet. <a href="{% url 'add_expense' %}">Add your first one.</a></p>
    </div>
{% endif %}
