{% extends "base.html" %}
{% block title %}Delete Expense — Fintellect{% endblock %}
{% block content %}
    <div class="form-card">
        <h1>Delete this expense?</h1>
        <p><strong>{{ expense.title }}</strong> — {{ expense.amount }} ({{ expense.category }})</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete It</button>
        </form>
        <p><a href="{% url 'expense_list' %}">Cancel</a></p>
    </div>
{% endblock %}
