{% extends "base.html" %}
{% block title %}Change Password — Fintellect{% endblock %}
{% block content %}
    <h1>Change Password</h1>
    <div class="form-card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Update Password</button>
        </form>
        <p><a href="{% url 'profile' %}">Cancel</a></p>
    </div>
{% endblock %}
