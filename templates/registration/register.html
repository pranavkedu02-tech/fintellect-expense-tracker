{% extends "base.html" %}
{% block title %}Register — Fintellect{% endblock %}
{% block content %}
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-eyebrow">Get started</div>
            <h1>Create an Account</h1>
            <p class="text-dim" style="margin-top: -4px; margin-bottom: 18px;">
                Sign up to start tracking your expenses.
            </p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-block">Register</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="{% url 'login' %}">Log in here</a>
            </p>
        </div>
    </div>
{% endblock %}
