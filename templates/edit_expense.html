{% extends "base.html" %}
{% block title %}Edit Expense — Fintellect{% endblock %}
{% block content %}
    <div class="form-card">
        <h1>Edit Expense</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Save Changes</button>
        </form>
        <p><a href="{% url 'expense_list' %}">Cancel</a></p>
    </div>
{% endblock %}
